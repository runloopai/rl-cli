name: E2E Smoke Tests

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev

jobs:
  e2e:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: runloopai/checkout@main

      - name: Setup pnpm
        uses: runloopai/pnpm-action@master

      - name: Setup Node.js
        uses: runloopai/setup-node@main
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run e2e smoke tests
        env:
          RUNLOOP_API_KEY: ${{ inputs.environment == 'prod' && secrets.RUNLOOP_SMOKETEST_PROD_API_KEY || secrets.RUNLOOP_SMOKETEST_DEV_API_KEY }}
          RUNLOOP_BASE_URL: ${{ inputs.environment == 'prod' && 'https://api.runloop.ai' || 'https://api.runloop.pro' }}
        run: pnpm run test:e2e
